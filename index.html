<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --container-bg: white;
            --container-shadow: rgba(0, 0, 0, 0.3);
            --text-primary: #333;
            --text-secondary: #999;
            --input-border: #e0e0e0;
            --input-focus: #667eea;
            --btn-primary: #667eea;
            --btn-primary-hover: #5568d3;
            --todo-bg: #f8f9fa;
            --todo-hover-bg: #f0f0f0;
            --todo-completed-bg: #f5f5f5;
            --todo-border: #667eea;
            --delete-btn: #ff6b6b;
            --delete-btn-hover: #ff5252;
            --toggle-border: #ddd;
        }

        html[data-theme="dark"] {
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --container-bg: #0f3460;
            --container-shadow: rgba(0, 0, 0, 0.6);
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --input-border: #444;
            --input-focus: #667eea;
            --btn-primary: #667eea;
            --btn-primary-hover: #5568d3;
            --todo-bg: #1a2332;
            --todo-hover-bg: #253445;
            --todo-completed-bg: #0f3460;
            --todo-border: #667eea;
            --delete-btn: #ff6b6b;
            --delete-btn-hover: #ff5252;
            --toggle-border: #444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--container-bg);
            border-radius: 10px;
            box-shadow: 0 10px 30px var(--container-shadow);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-primary);
            font-size: 2em;
            margin: 0;
        }

        .theme-toggle {
            background: var(--container-bg);
            border: 2px solid var(--toggle-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            border-color: var(--input-focus);
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #todoInput {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 5px;
            font-size: 1em;
            background: var(--container-bg);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        #todoInput:focus {
            outline: none;
            border-color: var(--input-focus);
        }

        #addBtn {
            padding: 12px 25px;
            background: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        #addBtn:hover {
            background: var(--btn-primary-hover);
        }

        #addBtn:active {
            transform: scale(0.98);
        }

        #todoList {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: var(--todo-bg);
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid var(--todo-border);
            transition: all 0.3s;
            color: var(--text-primary);
        }

        .todo-item:hover {
            background: var(--todo-hover-bg);
            transform: translateX(5px);
        }

        .todo-item.completed {
            border-left-color: #99cc99;
            background: var(--todo-completed-bg);
        }

        .checkbox {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .todo-text {
            color: var(--text-primary);
            font-size: 1em;
            flex: 1;
            cursor: pointer;
            transition: color 0.3s;
        }

        .todo-text:hover {
            color: var(--input-focus);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .delete-btn {
            padding: 8px 12px;
            background: var(--delete-btn);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.3s;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: var(--delete-btn-hover);
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 My Todo App</h1>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
        </div>
        
        <div class="input-container">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new todo..."
                autocomplete="off"
            />
            <button id="addBtn">Add</button>
        </div>

        <ul id="todoList"></ul>
        <div class="empty-message" id="emptyMessage">No todos yet. Add one to get started!</div>
    </div>

    <script>
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const emptyMessage = document.getElementById('emptyMessage');
        const themeToggle = document.getElementById('themeToggle');

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeToggleIcon(savedTheme);
        }

        function updateThemeToggleIcon(theme) {
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeToggleIcon(newTheme);
        }

        themeToggle.addEventListener('click', toggleTheme);

        // Load todos from localStorage
        function loadTodos() {
            const saved = localStorage.getItem('todos');
            return saved ? JSON.parse(saved) : [];
        }

        // Save todos to localStorage
        function saveTodos(todos) {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Initialize todos array
        let todos = loadTodos();

        // Render all todos
        function renderTodos() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';

            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.addEventListener('change', () => toggleTodo(index));

                const span = document.createElement('span');
                span.className = 'todo-text';
                span.textContent = todo.text;
                span.addEventListener('click', () => toggleTodo(index));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', () => deleteTodo(index));

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
            });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add a new todo
        function addTodo() {
            const text = todoInput.value.trim();

            if (text === '') {
                alert('Please enter a todo!');
                return;
            }

            todos.push({
                text: text,
                completed: false
            });

            saveTodos(todos);
            renderTodos();
            todoInput.value = '';
            todoInput.focus();
        }

        // Delete a todo
        function deleteTodo(index) {
            todos.splice(index, 1);
            saveTodos(todos);
            renderTodos();
        }

        // Toggle todo completion
        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveTodos(todos);
            renderTodos();
        }

        // Add event listeners
        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        // Initialize theme and render todos
        initTheme();
        renderTodos();
    </script>
</body>
</html>
